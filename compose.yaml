services:
  radar:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      RADAR_DATA_DIR: /app/data
    volumes:
      - radar-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
volumes:
  radar-data:
